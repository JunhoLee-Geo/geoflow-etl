name: GeoFlow checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.12
      - run: uv sync --frozen --extra dev --extra monitor
      - run: uv run --frozen --extra dev --extra monitor ruff check .
      - run: uv run --frozen --extra dev --extra monitor ruff format --check .
      - run: uv run --frozen --extra dev --extra monitor mypy
      - run: uv run --frozen --extra dev --extra monitor pytest tests/unit -q
      - run: uv run --frozen --extra dev --extra monitor geoflow run configs/sample.yml --dataset sample_points
      - run: uv run --frozen --extra dev --extra monitor geoflow run configs/sample.yml --dataset sample_geojson
      - run: uv run --frozen --extra dev --extra monitor geoflow run configs/quality.yml --dataset synthetic_quality
      - run: uv build
