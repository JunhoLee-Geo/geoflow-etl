[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "geoflow-etl"
version = "0.6.0"
description = "Reproducible geospatial ETL with explicit quality gates and provenance"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "numpy>=1.26,<3", "geopandas>=1.0,<2", "pandas>=2.2,<3", "shapely>=2.0,<3", "pyproj>=3.6,<4",
  "alembic>=1.14,<2", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "pydantic>=2.10,<3",
  "pandera[pandas]>=0.24,<1", "typer>=0.15,<1", "pyyaml>=6,<7"
]
[project.optional-dependencies]
monitor = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "streamlit>=1.42,<2", "httpx>=0.28,<1"]
dev = ["mypy>=1.15,<2", "types-PyYAML>=6,<7", "pytest>=8,<10", "ruff>=0.11,<1"]
[project.scripts]
geoflow = "geoflow.cli:app"
[tool.hatch.build.targets.wheel]
packages = ["src/geoflow"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a real PostgreSQL/PostGIS database"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]


[tool.mypy]
python_version = "3.12"
files = ["src/geoflow"]
ignore_missing_imports = true
check_untyped_defs = true
